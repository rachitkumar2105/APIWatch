name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API (lint, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with black
        run: black --check .

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  docker:
    name: Production image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t apiwatch .
      - name: Run like Hugging Face does and probe it
        run: |
          docker run -d --name apiwatch -p 7860:7860 \
            -e JWT_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            apiwatch
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7860/health/ready && exit 0
            sleep 1
          done
          docker logs apiwatch
          exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: for f in frontend/assets/*.js frontend/scripts/*.mjs; do node --check "$f"; done
      - name: Build with a production API URL
        working-directory: frontend
        env:
          APIWATCH_API_URL: https://example-apiwatch-api.hf.space
        run: npm run build && test -f dist/index.html && grep -q example-apiwatch-api dist/config.js

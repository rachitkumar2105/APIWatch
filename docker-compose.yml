services:
  api:
    build: .
    ports:
      - "8000:8000"
    # DB lives inside the container for this demo stack — it resets on
    # `docker compose down`. Bind-mounting a single SQLite file is a known
    # Docker footgun (a missing host file gets created as a directory).

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

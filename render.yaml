# Render Blueprint (free plan, no Hugging Face PRO needed): the same Docker
# image as Hugging Face Spaces. Render sets PORT itself; the Dockerfile's CMD
# already listens on ${PORT}.
# Render dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: apiwatch-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      # 256-bit random value generated by Render once, kept across deploys.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Your Vercel URL, e.g. https://apiwatch.vercel.app (asked for on first deploy).
      - key: CORS_ORIGINS
        sync: false
